services:
  postgres:
    image: postgres:16-alpine
    container_name: bogados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bogados
      POSTGRES_PASSWORD: bogados
      POSTGRES_DB: bogados
    ports:
      - "15432:5432"
    volumes:
      - bogados_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bogados -d bogados"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Buzón de pruebas: recibe todos los emails (invitaciones, recuperación) sin enviarlos
  # de verdad. SMTP en :1025, bandeja web en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: bogados-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    container_name: bogados-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://bogados:bogados@postgres:5432/bogados?schema=public
      JWT_SECRET: cambia-este-jwt-secreto-en-docker
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
      APP_URL: http://localhost:3000
      SMTP_URL: smtp://mailpit:1025
    volumes:
      - bogados_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    profiles:
      - full

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        # URL de la API vista desde el navegador (se incrusta al compilar)
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: bogados-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://bogados:bogados@postgres:5432/bogados?schema=public
      NEXTAUTH_SECRET: cambia-este-secreto-en-docker
      NEXTAUTH_URL: http://localhost:3000
      # URL de la API vista desde el servidor de Next (red interna de Docker)
      NEST_API_URL: http://api:3001/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    profiles:
      - full

volumes:
  bogados_pgdata:
  bogados_uploads:
