services:
  postgres:
    image: postgres:16-alpine
    container_name: bogados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bogados
      POSTGRES_PASSWORD: bogados
      POSTGRES_DB: bogados
    ports:
      - "5432:5432"
    volumes:
      - bogados_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bogados -d bogados"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bogados-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://bogados:bogados@postgres:5432/bogados?schema=public
      JWT_SECRET: cambia-este-jwt-secreto-en-docker
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
    volumes:
      - bogados_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  bogados_pgdata:
  bogados_uploads:
