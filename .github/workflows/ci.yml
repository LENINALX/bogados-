name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El repositorio es público: falla si algún commit contiene claves, tokens o .env reales
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
      - name: Buscar secretos (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact -v

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Valores ficticios: ni los tests ni el build se conectan a la base de datos
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: API — lint
        run: npm run lint -w @bogados/api
      - name: API — tests
        run: npm run test:api
      - name: API — build
        run: npm run build:api

      - name: Web — lint
        run: npm run lint -w @bogados/web
      - name: Web — tests
        run: npm run test:web
      # next build incluye el chequeo de tipos
      - name: Web — build
        run: npm run build -w @bogados/web
